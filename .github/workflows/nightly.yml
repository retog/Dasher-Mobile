name: Nightly APK build

on:
  schedule:
    # 02:30 UTC nightly
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes since the last nightly release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      tag: ${{ steps.decide.outputs.tag }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
    steps:
      - name: Decide whether to build and compute tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date_tag="nightly-$(date -u +%F)"
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")

          # The newest nightly release (the API lists releases newest first).
          previous_tag=$(jq -r '[.[] | select(.tag_name | startswith("nightly-"))][0].tag_name // empty' <<< "$releases")
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$previous_tag" ]; then
            previous_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${previous_tag}" --jq .sha)
            if [ "$previous_sha" = "$GITHUB_SHA" ]; then
              echo "No changes since ${previous_tag} (${previous_sha}) — skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual runs are suffixed with X<n>, one more than the highest manual
            # release made today: nightly-2026-10-24-X1, -X2, ...
            last_n=$(jq --arg prefix "${date_tag}-X" \
              '[.[].tag_name | select(startswith($prefix)) | ltrimstr($prefix) | tonumber?] | max // 0' <<< "$releases")
            tag="${date_tag}-X$((last_n + 1))"
          else
            tag="$date_tag"
          fi

          echo "Building ${tag} at ${GITHUB_SHA}"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and release APK
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK with its licences accepted, but not
      # necessarily the exact NDK and CMake versions app/build.gradle.kts pins.
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          out="dasher-mobile-${tag}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasher-mobile-${{ needs.check.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          previous="${{ needs.check.outputs.previous_tag }}"
          notes="Automated nightly build of Dasher Mobile at ${GITHUB_SHA}."
          if [ -n "$previous" ]; then
            notes="${notes}"$'\n\n'"Changes since ${previous}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_SHA}"
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$notes" \
            --prerelease \
            "${{ steps.apk.outputs.path }}"

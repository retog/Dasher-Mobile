name: Nightly APK build

on:
  schedule:
    # 02:30 UTC nightly
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes since the last nightly release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      tag: ${{ steps.decide.outputs.tag }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
    steps:
      # The signing key is kept in repository secrets; see "Nightly builds" in README.md.
      - name: Check for the signing key
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$NIGHTLY_KEYSTORE_BASE64" ] || [ -z "$NIGHTLY_KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets NIGHTLY_KEYSTORE_BASE64 and NIGHTLY_KEYSTORE_PASSWORD are not set; see \"Nightly builds\" in README.md."
            exit 1
          fi

      - name: Decide whether to build and compute tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date_tag="nightly-$(date -u +%F)"
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")

          # The newest published nightly release (the API lists releases newest first).
          previous_tag=$(jq -r '[.[] | select((.draft | not) and (.tag_name | startswith("nightly-")))][0].tag_name // empty' <<< "$releases")
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$previous_tag" ]; then
            # A tag that no longer resolves to a commit counts as a change.
            previous_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${previous_tag}" --jq .sha) || previous_sha=""
            if [ "$previous_sha" = "$GITHUB_SHA" ]; then
              echo "No changes since ${previous_tag} (${previous_sha}) — skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Tags used today, by a release or left behind by a deleted one.
          taken=$(
            jq -r '.[].tag_name' <<< "$releases"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${date_tag}" --jq '.[].ref | ltrimstr("refs/tags/")'
          )
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && ! grep -qxF "$date_tag" <<< "$taken"; then
            tag="$date_tag"
          else
            # Manual runs, and a scheduled run whose tag is taken, are suffixed with X<n>,
            # one more than the highest used today: nightly-2026-10-24-X1, -X2, ...
            last_n=$(sed -n "s/^${date_tag}-X\([0-9]\{1,9\}\)\$/\1/p" <<< "$taken" | sort -n | tail -n 1)
            tag="${date_tag}-X$((10#${last_n:-0} + 1))"
          fi

          echo "Building ${tag} at ${GITHUB_SHA}"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and release APK
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK with its licences accepted, but not
      # necessarily the exact NDK and CMake versions app/build.gradle.kts pins.
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing key
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$NIGHTLY_KEYSTORE_BASE64" > "$RUNNER_TEMP/nightly.jks"

      # -Pnightly signs the APK with the nightly key (see "Nightly builds" in README.md).
      - name: Build release APK
        env:
          NIGHTLY_KEYSTORE_FILE: ${{ runner.temp }}/nightly.jks
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: dasher-nightly
        run: ./gradlew --no-daemon assembleRelease -Pnightly

      # Job outputs reach the scripts through env, never interpolated into them: a
      # release tag is outside data and may contain shell metacharacters.
      - name: Rename APK
        id: apk
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          out="dasher-mobile-${TAG}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasher-mobile-${{ needs.check.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.check.outputs.previous_tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          notes="Automated nightly build of Dasher Mobile at ${GITHUB_SHA}."
          if [ -n "$PREVIOUS_TAG" ]; then
            notes="${notes}"$'\n\n'"Changes since ${PREVIOUS_TAG}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_SHA}"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$notes" \
            --prerelease \
            "$APK"
